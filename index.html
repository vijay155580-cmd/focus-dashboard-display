<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus Dashboard V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Segoe UI,Arial,sans-serif;color:#fff;background:#070d18}
.bg{position:fixed;inset:0;background:
radial-gradient(circle at 15% 15%,#3275c722,transparent 32%),
radial-gradient(circle at 85% 85%,#8c50dc20,transparent 35%),
linear-gradient(135deg,#07101d,#10182a 55%,#0a0b18);z-index:-2}
.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#ffffff05 1px,transparent 1px);background-size:45px 45px}
.card{width:min(1100px,94vw);height:min(92vh,900px);padding:30px 38px;border:1px solid #ffffff1c;border-radius:26px;background:#090f1cd0;backdrop-filter:blur(20px);box-shadow:0 25px 80px #0006;overflow:auto;position:relative}
.icon{border:0;background:#ffffff12;color:white;border-radius:11px;width:40px;height:40px;font-size:19px;cursor:pointer}.icon:hover{background:#ffffff22}
#settingsBtn{position:absolute;right:22px;top:22px}
.hero{text-align:center;margin:8px 50px 25px}.eyebrow{font-size:11px;letter-spacing:4px;opacity:.5;margin-bottom:7px}
h1{font-size:clamp(30px,4vw,48px);margin:0 0 13px}.countdown{font-variant-numeric:tabular-nums;font-size:clamp(27px,4.5vw,49px);font-weight:700}.target{margin-top:8px;opacity:.48;font-size:13px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:8px 0 10px}h2{font-size:19px;margin:0}.small{font-size:12px;opacity:.5}
.progress{height:5px;background:#ffffff12;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#fff;border-radius:99px;transition:.25s}
#taskList{margin-top:10px}.task{display:flex;align-items:center;gap:11px;padding:9px 12px;margin:6px 0;border-radius:11px;background:#ffffff09}.task input{width:17px;height:17px}.task span{flex:1;font-size:14px}.done span{text-decoration:line-through;opacity:.35}
.del{border:0;background:none;color:#fff;opacity:.35;font-size:17px;cursor:pointer}
form{display:flex;gap:7px;margin-top:9px}input,button{font:inherit}#taskInput{flex:1;min-width:0;border:1px solid #ffffff1c;background:#0003;color:white;border-radius:10px;padding:10px}form button,.save{border:0;border-radius:10px;background:#fff;color:#111;font-weight:650;padding:0 16px;cursor:pointer}
.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.subject{min-width:0;border:1px solid #ffffff12;background:#ffffff07;border-radius:17px;padding:16px}
.subject-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.subject-head h3{margin:0;font-size:17px}.subject-stat{font-size:11px;opacity:.5}
.chapter{background:#ffffff08;border-radius:11px;padding:10px;margin:7px 0}.chapter-top{display:flex;align-items:center;gap:8px}.chapter-top input{width:16px;height:16px}.chapter-name{flex:1;font-size:13px;line-height:1.25}.chapter.done .chapter-name{text-decoration:line-through;opacity:.4}
.lectures{display:flex;align-items:center;gap:6px;margin-top:8px;padding-left:24px}.lecture-label{font-size:11px;opacity:.55;flex:1}.mini{width:25px;height:25px;border:0;border-radius:7px;background:#ffffff10;color:#fff;cursor:pointer}.mini:hover{background:#ffffff1f}.lecture-count{font-size:11px;min-width:42px;text-align:center}
.addchapter{width:100%;border:1px dashed #ffffff25;background:transparent;color:#fff;opacity:.6;border-radius:9px;padding:7px;cursor:pointer;margin-top:5px}.addchapter:hover{opacity:1}
.subject-progress{margin:9px 0 3px}.subject-progress .bar{background:#fff}
.settings{position:fixed;right:22px;top:22px;width:min(430px,calc(100vw - 44px));max-height:calc(100vh - 44px);overflow:auto;padding:22px;border-radius:18px;background:#0b121ff7;border:1px solid #ffffff20;box-shadow:0 20px 70px #0008;z-index:10}
.hidden{display:none}.settings-head{display:flex;align-items:center;justify-content:space-between}.settings-head h2{margin:0}
label{display:block;font-size:12px;opacity:.75;margin:13px 0}label input{display:block;margin-top:6px;width:100%;border:1px solid #ffffff1d;background:#0004;color:#fff;border-radius:9px;padding:10px}
.setting-actions{display:flex;gap:8px}.setting-actions button{height:40px;flex:1}.danger{border:1px solid #ff64644d;background:transparent;color:#ffb2b2;border-radius:9px;cursor:pointer}
.chapter-editor{border-top:1px solid #ffffff12;margin-top:16px;padding-top:10px}.editor-row{display:grid;grid-template-columns:1fr 80px 80px 32px;gap:6px;margin:6px 0}.editor-row input{width:100%;background:#0004;color:#fff;border:1px solid #ffffff15;border-radius:7px;padding:7px;font-size:11px}.editor-row button{border:0;border-radius:7px;background:#ffffff0e;color:#fff;cursor:pointer}
.hint{font-size:10px;opacity:.4;line-height:1.5}
@media(max-width:850px){.card{height:95vh;padding:24px}.subjects{grid-template-columns:1fr}.hero{margin:5px 35px 20px}}
</style>
</head>
<body>
<div class="bg"></div>
<main class="card">

<section class="hero">
<div class="eyebrow">COUNTDOWN</div>
<h1 id="eventTitle">Focus!!!</h1>
<div id="countdown" class="countdown">Set a target date</div>
<div id="targetText" class="target"></div>
</section>

<section>
<div class="section-title"><h2>Today's Tasks</h2><span id="progressText" class="small">0 / 0</span></div>
<div class="progress"><div id="taskBar" class="bar"></div></div>
<div id="taskList"></div>

</section>

<div class="subjects">
<section class="subject" data-subject="Physics">
<div class="subject-head"><h3>⚛ Physics</h3><span class="subject-stat" id="PhysicsStat">0/0 chapters</span></div>
<div class="subject-progress progress"><div id="PhysicsBar" class="bar"></div></div>
<div id="PhysicsList"></div>
</section>
<section class="subject" data-subject="Chemistry">
<div class="subject-head"><h3>🧪 Chemistry</h3><span class="subject-stat" id="ChemistryStat">0/0 chapters</span></div>
<div class="subject-progress progress"><div id="ChemistryBar" class="bar"></div></div>
<div id="ChemistryList"></div>
</section>
<section class="subject" data-subject="Mathematics">
<div class="subject-head"><h3>📐 Mathematics</h3><span class="subject-stat" id="MathematicsStat">0/0 chapters</span></div>
<div class="subject-progress progress"><div id="MathematicsBar" class="bar"></div></div>
<div id="MathematicsList"></div>
</section>
</div>
</main>



<script>
const $=id=>document.getElementById(id);
const defaultData={title:"Focus!!!",target:"",showSeconds:true,tasks:[],subjects:{Physics:[],Chemistry:[],Mathematics:[]}};
async function getData(){
  try{
    const response=await fetch("https://script.google.com/macros/s/AKfycbx1P01RHFO6-toTCwzXE1Is363VSgqgGVB1i3h4FWDTyVTW1HN8TVkiGZgPzeypISn6-w/exec");
    const d=await response.json();

    for(const s of ["Physics","Chemistry","Mathematics"])
      if(!Array.isArray(d.subjects?.[s])) d.subjects[s]=[];

    return d;
  }catch(e){
    console.error("Sync failed:",e);
    return structuredClone(defaultData);
  }
}
let data=null;
const pad=n=>String(n).padStart(2,"0");
function renderTasks(){const list=$("taskList");list.innerHTML="";data.tasks.forEach(t=>{const r=document.createElement("div");r.className="task"+(t.done?" done":"");const c=document.createElement("input");c.type="checkbox";c.checked=!!t.done;c.disabled=true;const s=document.createElement("span");s.textContent=t.text;r.append(c,s);list.appendChild(r)});const total=data.tasks.length,done=data.tasks.filter(t=>t.done).length;$("progressText").textContent=`${done} / ${total}`;$("taskBar").style.width=total?done/total*100+"%":"0%"}
function renderSubjects(){for(const s of ["Physics","Chemistry","Mathematics"]){const list=$(`${s}List`);list.innerHTML="";const chapters=data.subjects[s];chapters.forEach(c=>{const r=document.createElement("div");r.className="chapter"+(c.complete?" done":"");const top=document.createElement("div");top.className="chapter-top";const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!c.complete;cb.disabled=true;const name=document.createElement("span");name.className="chapter-name";name.textContent=c.name||"Untitled chapter";top.append(cb,name);r.appendChild(top);const lec=document.createElement("div");lec.className="lectures";const lab=document.createElement("span");lab.className="lecture-label";lab.textContent="Batch lectures";const count=document.createElement("span");count.className="lecture-count";count.textContent=`${c.doneLectures||0}/${c.total||0}`;lec.append(lab,count);r.appendChild(lec);list.appendChild(r)});const total=chapters.length,complete=chapters.filter(c=>c.complete).length;$(`${s}Stat`).textContent=`${complete}/${total} chapters`;$(`${s}Bar`).style.width=total?complete/total*100+"%":"0%"}}
function tick(){ $("eventTitle").textContent=data.title||"Focus!!!";if(!data.target){$("countdown").textContent="Set a target date";$("targetText").textContent="";return}const target=new Date(data.target),now=new Date();let d=target-now;$("targetText").textContent="Target: "+target.toLocaleString([],{dateStyle:"medium",timeStyle:"short"});if(d<=0){$("countdown").textContent="TIME'S UP";return}const days=Math.floor(d/86400000);d%=86400000;const h=Math.floor(d/3600000);d%=3600000;const m=Math.floor(d/60000);d%=60000;const s=Math.floor(d/1000);$("countdown").textContent=data.showSeconds!==false?`${days}d  ${pad(h)}h  ${pad(m)}m  ${pad(s)}s`:`${days}d  ${pad(h)}h  ${pad(m)}m`}
async function refresh(){
  data=await getData();
  renderTasks();
  renderSubjects();
  tick();
}

refresh();
setInterval(refresh,10000);
setInterval(tick,1000);
</script>
</body>
</html>
